name: PYMENTOR PRO - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. DESCARGAR EL REPOSITORIO
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. CONFIGURAR PYTHON DEL SISTEMA
      # ==========================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ==========================================
      # 3. INSTALAR DEPENDENCIAS DEL SISTEMA
      # ==========================================
      - name: Instalar dependencias Android
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache


      # ==========================================
      # 4. INSTALAR BUILDOZER
      # ==========================================
      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install \
            "buildozer==1.6.0" \
            "cython==0.29.34"


      # ==========================================
      # 5. CREAR CARPETA DEL PROYECTO
      # ==========================================
      - name: Preparar proyecto
        run: |
          mkdir -p project

          unzip -q PYMENTOR_PRO_ANDROID_READY.zip -d project

          echo "Contenido extraído:"
          find project -maxdepth 3 -type f | sort


      # ==========================================
      # 6. DETECTAR AUTOMÁTICAMENTE
      #    LA CARPETA DE PYMENTOR
      # ==========================================
      - name: Detectar proyecto Python
        run: |
          SPEC=$(find project -name "buildozer.spec" -type f | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: No se encontró buildozer.spec"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 7. VERIFICAR ARCHIVOS DEL PROYECTO
      # ==========================================
      - name: Verificar proyecto
        run: |
          echo "======================================"
          echo "PROYECTO: $PROJECT_DIR"
          echo "======================================"

          test -f "$PROJECT_DIR/main.py"
          test -f "$PROJECT_DIR/buildozer.spec"
          test -f "$PROJECT_DIR/requirements.txt"

          test -f "$PROJECT_DIR/data/lessons.json"
          test -f "$PROJECT_DIR/data/exercises.json"
          test -f "$PROJECT_DIR/data/challenges.json"
          test -f "$PROJECT_DIR/data/projects.json"

          echo ""
          echo "Archivos principales:"
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "requirements.txt:"
          cat "$PROJECT_DIR/requirements.txt"

          echo ""
          echo "VERIFICACIÓN COMPLETADA"


      # ==========================================
      # 8. PREPARAR PYTHON-FOR-ANDROID
      #
      # IMPORTANTE:
      # Usamos DEVELOP porque contiene
      # la corrección para las ruedas Android
      # como charset-normalizer.
      # ==========================================
      - name: Preparar python-for-android
        run: |
          cd "$PROJECT_DIR"

          rm -rf .buildozer

          mkdir -p .buildozer/android/platform

          cd .buildozer/android/platform

          git clone \
            --branch develop \
            --depth 1 \
            https://github.com/kivy/python-for-android.git

          echo ""
          echo "python-for-android preparado."

          cd python-for-android

          echo "Commit utilizado:"
          git log -1 --oneline


      # ==========================================
      # 9. MOSTRAR CONFIGURACIÓN BUILDOZER
      # ==========================================
      - name: Revisar buildozer.spec
        run: |
          echo "======================================"
          echo "BUILDOZER.SPEC"
          echo "======================================"

          cat "$PROJECT_DIR/buildozer.spec"


      # ==========================================
      # 10. COMPILAR APK DEBUG
      # ==========================================
      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          echo "======================================"
          echo "INICIANDO COMPILACIÓN"
          echo "======================================"

          buildozer -v android debug


      # ==========================================
      # 11. BUSCAR APK
      # ==========================================
      - name: Verificar APK generado
        run: |
          echo "======================================"
          echo "APK GENERADO"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" | wc -l)

          echo ""
          echo "Cantidad de APK encontrados: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi


      # ==========================================
      # 12. SUBIR APK COMO ARTIFACT
      # ==========================================
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PYMENTOR-PRO-debug-APK
          path: |
            project/**/*.apk
          if-no-files-found: error
          retention-days: 14
