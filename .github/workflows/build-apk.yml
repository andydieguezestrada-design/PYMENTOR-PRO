name: PYMENTOR PRO - Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            build-essential \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Buildozer y dependencias
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install cython==0.29.34

      - name: Buscar proyecto
        run: |
          echo "Contenido del repositorio:"
          find . -maxdepth 3 -type f | sort

      - name: Detectar carpeta del proyecto
        run: |
          if [ -f "buildozer.spec" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f "buildozer.spec" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            PROJECT_DIR=$(find . -name "buildozer.spec" -printf '%h\n' | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: No se encontró buildozer.spec"
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          fi

      - name: Verificar proyecto Python
        run: |
          echo "Proyecto: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/buildozer.spec"
          test -f "$PROJECT_DIR/main.py"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          buildozer -v android debug

      - name: Buscar APK
        run: |
          echo "APK generada:"
          find . -type f -name "*.apk" -print

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PYMENTOR-PRO-APK
          path: "**/*.apk"
          if-no-files-found: error
